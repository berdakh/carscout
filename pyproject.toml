[project]
name = "carscout"
version = "0.1.0"
description = "AI research agent that helps first-time buyers find, price, and finance a used car using free data sources."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "ddgs>=9",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
