# Runs the CarScout watchlist scan every day and publishes the report to the site.
#
# Setup (repository Settings):
#   Secrets and variables > Actions > Secrets:   ANTHROPIC_API_KEY and/or OPENAI_API_KEY
#   Secrets and variables > Actions > Variables (optional):
#     SCAN_PROVIDER  anthropic | openai   (default: Claude if its key is set)
#     SCAN_MODEL     e.g. claude-sonnet-5-5 or gpt-5.5   (default: claude-opus-5-5 / gpt-5.5)
# Without any key the scan still runs the free checks: recalls, page status, grading.
name: Daily scan

on:
  schedule:
    - cron: "23 12 * * *"   # 12:23 UTC every day; change to suit your time zone
  workflow_dispatch: {}      # "Run workflow" button, and the site's "Run scan now"

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Scan watchlist
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCAN_PROVIDER: ${{ vars.SCAN_PROVIDER }}
          SCAN_MODEL: ${{ vars.SCAN_MODEL }}
        run: python scripts/daily_scan.py

      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Daily scan $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
